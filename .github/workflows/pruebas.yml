# Pruebas automáticas en cada pull request (D57, D59, RNF:0012)
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

jobs:
  phpunit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/laravel
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: adoptauy_test
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: adoptauy_test
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_ENV: testing
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, mbstring, intl, zip, gd, bcmath, exif
          coverage: pcov
      - name: Dependencias
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Migraciones
        run: php artisan migrate --force
      - name: Usuarios de MySQL del documento (16.3.4)
        # Los mismos que en Docker, con las claves de desarrollo, solo sobre adoptauy_test
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PWD: root
          SQL: ../../docs/base-de-datos/usuarios.sql
          BASES: adoptauy_test
        run: sh ../../docker/mysql/usuarios.sh
      - name: PHPUnit
        # Reportes para el informe de pruebas: JUnit, testdox y cobertura (texto y HTML)
        run: |
          mkdir -p reportes
          vendor/bin/phpunit --log-junit reportes/junit.xml --testdox-text reportes/testdox.txt \
            --coverage-text=reportes/cobertura.txt --coverage-html reportes/cobertura-html
      - name: Resumen de resultados
        if: always()
        run: python3 ../../.github/scripts/resumen_junit.py reportes/junit.xml reportes/cobertura.txt
      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-phpunit
          path: src/laravel/reportes
          retention-days: 30

  dusk:
    # Pruebas funcionales en Chrome (Laravel Dusk): prueba de humo CP-01, CP-04, CP-05, CP-06
    # y vista a 360 px (CP-39). Chrome ya viene instalado en el runner de GitHub.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/laravel
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: adoptauy_test
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: adoptauy_test
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8000
      MAIL_MAILER: log
      CACHE_STORE: array            # sin límite de envíos acumulado entre pruebas
      DUSK_URL: http://127.0.0.1:8000
      DUSK_DRIVER_URL: http://localhost:9515
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, mbstring, intl, zip, gd, bcmath, exif
      - name: Dependencias
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan storage:link
      - name: Usuarios de MySQL del documento (16.3.4)
        # Los mismos que en Docker, con las claves de desarrollo, solo sobre adoptauy_test
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PWD: root
          SQL: ../../docs/base-de-datos/usuarios.sql
          BASES: adoptauy_test
        run: sh ../../docker/mysql/usuarios.sh
      - name: ChromeDriver igual a la versión de Chrome del runner
        run: php artisan dusk:chrome-driver --detect
      - name: Levantar ChromeDriver y el sitio
        run: |
          vendor/laravel/dusk/bin/chromedriver-linux --port=9515 &
          php -S 127.0.0.1:8000 -t public tests/Browser/servidor.php > /dev/null 2>&1 &
          sleep 3
      - name: Dusk
        run: php artisan dusk
      - name: Capturas si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-dusk
          path: src/laravel/tests/Browser/screenshots
          retention-days: 7

  base-de-datos:
    # Crea la base con docs/base-de-datos/adoptauy.sql en MySQL 8.4 y prueba
    # tablas, claves y valores por defecto
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Script SQL y pruebas de restricciones
        env:
          MYSQL: mysql -h 127.0.0.1 -P 3306 -uroot
          MYSQL_PWD: root
        run: bash docs/base-de-datos/probar.sh

  entorno-docker:
    # Verifica que "git clone + docker compose up" deje el sitio funcionando
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up
        run: |
          printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" > .env   # el runner no usa el UID 1000
          docker compose up -d --build
      - name: Esperar a que Laravel esté listo
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T app test -f storage/.preparado; then echo "Laravel listo"; exit 0; fi
            sleep 5
          done
          docker compose logs app; exit 1
      - name: Usuarios de MySQL creados (servicio usuarios-bd)
        run: docker compose wait usuarios-bd
      - name: El sitio responde por HTTPS y HTTP redirige
        run: |
          curl -skf -o /dev/null -w "HTTPS %{http_code}\n" https://localhost:8443/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "301"
          curl -sI http://localhost:8080/ | grep -i '^location: https://localhost:8443/' 
      - name: Mailpit responde
        run: curl -sf -o /dev/null http://localhost:8025/
      - name: Verificación del despliegue (scripts/verificar-despliegue.sh)
        # Integración aplicación + base de datos + servicios; la salida queda en el resumen y en una anotación
        run: |
          set +e
          bash scripts/verificar-despliegue.sh > verificacion.txt 2>&1; r=$?
          sed 's/\x1b\[[0-9;]*m//g' verificacion.txt > verificacion-limpia.txt
          cat verificacion-limpia.txt
          { echo '## Verificación del despliegue'; echo '```'; cat verificacion-limpia.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Verificación del despliegue::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' verificacion-limpia.txt)"
          exit $r
      - name: Pruebas dentro del contenedor
        run: docker compose exec -T app php artisan test
      - name: Logs si algo falló
        if: failure()
        run: docker compose logs
