# Pruebas automáticas en cada pull request (D57, D59, RNF:0012)
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

jobs:
  phpunit:
    runs-on: ubuntu-24.04
    if: ${{ hashFiles('artisan') != '' }}   # se activa cuando el proyecto Laravel está en el repo
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: adoptauy_test
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: adoptauy_test
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_ENV: testing
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, mbstring, intl, zip, gd, bcmath, exif
          coverage: none
      - name: Dependencias
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Migraciones
        run: php artisan migrate --force
      - name: PHPUnit
        run: php artisan test
