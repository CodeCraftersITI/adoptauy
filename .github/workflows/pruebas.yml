# Pruebas automáticas en cada pull request (D57, D59, RNF:0012)
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

jobs:
  phpunit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/laravel
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: adoptauy_test
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: adoptauy_test
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_ENV: testing
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, mbstring, intl, zip, gd, bcmath, exif
          coverage: none
      - name: Dependencias
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Migraciones
        run: php artisan migrate --force
      - name: PHPUnit
        run: php artisan test

  base-de-datos:
    # Crea la base con docs/base-de-datos/adoptauy.sql en MySQL 8.4 y prueba
    # tablas, claves y valores por defecto
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Script SQL y pruebas de restricciones
        env:
          MYSQL: mysql -h 127.0.0.1 -P 3306 -uroot
          MYSQL_PWD: root
        run: bash docs/base-de-datos/probar.sh

  entorno-docker:
    # Verifica que "git clone + docker compose up" deje el sitio funcionando
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up
        run: |
          printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" > .env   # el runner no usa el UID 1000
          docker compose up -d --build
      - name: Esperar a que Laravel esté listo
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T app test -f storage/.preparado; then echo "Laravel listo"; exit 0; fi
            sleep 5
          done
          docker compose logs app; exit 1
      - name: El sitio responde por HTTPS y HTTP redirige
        run: |
          curl -skf -o /dev/null -w "HTTPS %{http_code}\n" https://localhost:8443/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "301"
          curl -sI http://localhost:8080/ | grep -i '^location: https://localhost:8443/' 
      - name: Mailpit responde
        run: curl -sf -o /dev/null http://localhost:8025/
      - name: Pruebas dentro del contenedor
        run: docker compose exec -T app php artisan test
      - name: Logs si algo falló
        if: failure()
        run: docker compose logs
