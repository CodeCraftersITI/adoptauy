# /etc/ssh/sshd_config.d/10-adoptauy.conf · generado por infra/posix/aplicar.sh
# sshd toma el PRIMER valor que encuentra: este archivo (10-) gana sobre
# 50-cloud-init.conf y sobre el resto de /etc/ssh/sshd_config.

# Autenticación: solo clave pública, nunca root
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# Sin túneles ni reenvíos: el servidor no sirve de salto hacia la red
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no

# Quién entra y desde dónde: tienen que cumplirse las dos condiciones
AllowGroups codecrafters
AllowUsers camilo@{{IP_CAMILO}} leandro@{{IP_LEANDRO}} inaki@{{IP_INAKI}} rodrigo@{{IP_RODRIGO}}

# Cualquier origen fuera de la red de administración queda rechazado
Match Address *,!{{RED_ADMIN}}
    DenyUsers *
