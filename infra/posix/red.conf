# AdoptaUY · Datos de red del servidor (VM Ubuntu Server 24.04 con adaptador puente)
# Completar con la red real donde se instala la VM (por ejemplo, la de la defensa)
# antes de ejecutar infra/posix/aplicar.sh. Mientras quede algún __COMPLETAR__,
# el script no aplica nada.

# Red desde la que se administra el servidor por SSH, en notación CIDR (ej. 192.168.1.0/24)
RED_ADMIN="__COMPLETAR__"

# IP fija (o reserva DHCP) de la PC de cada integrante dentro de RED_ADMIN
IP_CAMILO="__COMPLETAR__"
IP_LEANDRO="__COMPLETAR__"
IP_INAKI="__COMPLETAR__"
IP_RODRIGO="__COMPLETAR__"

# Opcional: IP del servidor Zabbix que consulta al agente (TCP 10050). Vacío = no se abre
IP_ZABBIX=""

# Opcional: copia externa de los respaldos por rsync sobre SSH (usuario@host:/ruta).
# Vacío = solo copias locales (queda como riesgo abierto de la regla 3-2-1)
DESTINO_REMOTO=""
