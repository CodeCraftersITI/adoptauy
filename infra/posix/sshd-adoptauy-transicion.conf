# /etc/ssh/sshd_config.d/10-adoptauy.conf · ETAPA DE TRANSICIÓN
# Generado por infra/posix/aplicar.sh --ssh-con-contrasena (o aplicar-transicion.sh).
# Mientras el equipo carga sus claves: se entra con contraseña o con clave.
# Se reemplaza por sshd-adoptauy.conf al ejecutar aplicar.sh sin la opción.

PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no

# Integrantes (codecrafters) y el administrador (sudo), sin filtro por PC
AllowGroups codecrafters sudo

# Igual que en la etapa definitiva: solo desde la red de administración
Match Address *,!{{RED_ADMIN}}
    DenyUsers *
