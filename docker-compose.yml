# AdoptaUY · entorno de desarrollo y servidor local
#
#   git clone https://github.com/CodeCraftersITI/adoptauy.git && cd adoptauy
#   docker compose up -d --build
#
# La primera vez el contenedor app instala Composer, genera APP_KEY y migra la base,
# y web genera un certificado HTTPS autofirmado. Seguí el avance con:
#   docker compose logs -f app
# Laravel vive en src/laravel (se monta en /var/www/laravel).
# Los valores por defecto sirven para desarrollar; en el servidor local definí
# contraseñas propias en un archivo .env (ver .env.example).

name: adoptauy

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: adoptauy/php:dev
  restart: unless-stopped
  working_dir: /var/www/laravel
  volumes:
    - ./src:/var/www
  environment: &php-env             # pisan los valores de src/laravel/.env
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-adoptauy}
    DB_USERNAME: ${DB_USERNAME:-adoptauy}
    DB_PASSWORD: ${DB_PASSWORD:-adoptauy_dev}
    MAIL_MAILER: smtp
    MAIL_HOST: ${MAIL_HOST:-mailpit}
    MAIL_PORT: ${MAIL_PORT:-1025}
    APP_URL: ${APP_URL:-https://localhost:8443}
  depends_on:
    db:
      condition: service_healthy
  networks: [backend]

services:
  app:                              # PHP-FPM 8.4 + Laravel 13; prepara Laravel la primera vez
    <<: *php
    environment:
      <<: *php-env
      PREPARAR: "1"

  queue:                            # correos y trabajos en segundo plano (RF:0063)
    <<: *php
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]

  scheduler:                        # tareas de los días 15, 22 y 30 a las 03:00 (RF:0047, RF:0055, RF:0058)
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  web:                              # Nginx con HTTPS (RNF:0013, D73)
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: adoptauy/nginx:dev
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"               # 8080/8443 para no chocar con XAMPP, IIS u otros
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./src:/var/www:ro
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/certs:/etc/nginx/certs
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}         # para que la redirección de HTTP vaya al puerto correcto
    depends_on: [app]
    networks: [backend]

  db:                               # MySQL 8.4 LTS
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-adoptauy}
      MYSQL_USER: ${DB_USERNAME:-adoptauy}
      MYSQL_PASSWORD: ${DB_PASSWORD:-adoptauy_dev}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev}
      TZ: America/Montevideo
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:${DB_PORT_LOCAL:-3307}:3306"   # solo desde tu máquina (DBeaver, Workbench)
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  mailpit:                          # desarrollo: captura los correos (no salen a Internet)
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks: [backend]

  node:                             # compilar CSS/JS con Vite:  docker compose run --rm node npm run build
    image: node:22-alpine
    profiles: ["herramientas"]
    working_dir: /var/www/laravel
    volumes:
      - ./src:/var/www
    networks: [backend]

  mail:                             # producción: Postfix relay al SMTP externo (D54, D75)
    image: boky/postfix             # fijar la versión exacta al desplegar
    profiles: ["produccion"]
    restart: unless-stopped
    environment:
      RELAYHOST: "[${SMTP_RELAY_HOST:-smtp.ejemplo.com}]:587"
      RELAYHOST_USERNAME: ${SMTP_RELAY_USER:-}
      RELAYHOST_PASSWORD: ${SMTP_RELAY_PASSWORD:-}
      ALLOWED_SENDER_DOMAINS: ${MAIL_SENDER_DOMAIN:-adoptauy.local}
    networks: [backend]

volumes:
  dbdata:

networks:
  backend:
